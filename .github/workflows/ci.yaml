---
name: CI
on:
  schedule:
    # At 08:00 UTC on Saturday.
    - cron: "0 8 * * 6"
  push:
    branches:
      - main
      - hotfix/**
      - release/**
  pull_request:

permissions:
  contents: read

env:
  GOPATH: ${{ github.workspace }}/gopath
  GOBIN: ${{ github.workspace }}/gopath/bin
  GOPROXY: https://proxy.golang.org
  GOTOOLCHAIN: local
  GORACE: halt_on_error=1

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }}, PostgreSQL ${{ matrix.images.postgres }})
    timeout-minutes: 30
    continue-on-error: ${{ matrix.go-version == 'tip' }}
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x, tip]
        images:
          - { postgres: "postgres:14", mysql: "mysql:8.0", mssql: "mcr.microsoft.com/mssql/server:2017-latest" }
          - { postgres: "postgres:15", mysql: "mysql:8.4", mssql: "mcr.microsoft.com/mssql/server:2019-latest" }
          - { postgres: "postgres:16", mysql: "mysql:9.7", mssql: "mcr.microsoft.com/mssql/server:2022-latest" }
          - { postgres: "postgres:17", mysql: "mysql:26.7.0", mssql: "mcr.microsoft.com/mssql/server:2025-latest" }
          - { postgres: "postgres:18.6", mysql: "mysql:26.7.0", mssql: "mcr.microsoft.com/mssql/server:2025-latest" }
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: gopath/src/gopkg.in/reform.v1
    env:
      REFORM_POSTGRES_IMAGE: ${{ matrix.images.postgres }}
      REFORM_MYSQL_IMAGE: ${{ matrix.images.mysql }}
      REFORM_MSSQL_IMAGE: ${{ matrix.images.mssql }}
    steps:
      - name: Check out code into GOPATH
        uses: actions/checkout@v7.0.1
        with:
          path: gopath/src/gopkg.in/reform.v1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version == 'tip' && '1.27.x' || matrix.go-version }}
          check-latest: true
          cache-dependency-path: |
            gopath/src/gopkg.in/reform.v1/go.sum
            gopath/src/gopkg.in/reform.v1/tools/go.sum

      - name: Set up Go tip
        if: matrix.go-version == 'tip'
        run: |
          git clone --depth=1 https://go.googlesource.com/go "$RUNNER_TEMP/gotip"
          (cd "$RUNNER_TEMP/gotip/src" && ./make.bash)
          echo "GOROOT=$RUNNER_TEMP/gotip" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gotip/bin" >> "$GITHUB_PATH"

      - name: Record Go version
        run: echo "GO_VERSION=$(go version)" >> "$GITHUB_ENV"

      - name: Pull Docker images
        run: docker compose pull

      - name: Stop conflicting Ubuntu services
        run: sudo systemctl stop mysql.service postgresql.service || true

      - name: Install development tools
        run: make init

      - name: Start development environment
        run: make env-up-detach

      - name: Run all tests
        run: make test

      - name: Check module and generated source consistency
        run: make ci-check-changes

      - name: Upload coverage information
        uses: codecov/codecov-action@v7.1.1
        with:
          files: gopath/src/gopkg.in/reform.v1/coverage.txt
          disable_search: true
          env_vars: GO_VERSION,REFORM_POSTGRES_IMAGE,REFORM_MYSQL_IMAGE,REFORM_MSSQL_IMAGE
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Database diagnostics
        if: failure()
        run: |
          go version
          docker compose ps --all
          docker compose logs --no-color --tail=100

      - name: Stop development environment
        if: always()
        run: make env-down

  lint:
    name: Lint
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: gopath/src/gopkg.in/reform.v1
    steps:
      - name: Check out code into GOPATH
        uses: actions/checkout@v7.0.1
        with:
          path: gopath/src/gopkg.in/reform.v1
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache-dependency-path: |
            gopath/src/gopkg.in/reform.v1/go.sum
            gopath/src/gopkg.in/reform.v1/tools/go.sum

      - name: Install development tools
        run: make init

      - name: Run required checks
        run: |
          bin/golangci-lint run --config=.golangci-required.yml
          bin/golangci-lint fmt --config=.golangci-required.yml --diff

      - name: Run advisory linters
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GO_REFORM_BOT_TOKEN }}
        run: |
          reporter=local
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$REVIEWDOG_GITHUB_API_TOKEN" ]; then
            reporter=github-pr-review
          fi
          bin/golangci-lint run --issues-exit-code=0 |
            bin/reviewdog -f=golangci-lint -name='Optional linters' -reporter="$reporter"
          bin/go-consistent -pedantic ./... |
            bin/reviewdog -f=go-consistent -name=go-consistent -reporter="$reporter"

      - name: Check module and generated source consistency
        run: make ci-check-changes
