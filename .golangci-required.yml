---
version: "2"
# The most valuable linters; they are required to pass for PRs to be merged.
linters:
  default: none
  enable:
    - depguard
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
            - gopkg.in/reform.v1
            - github.com/
    govet:
      enable:
        - shadow
  exclusions:
    presets: []
    paths:
      - internal/test/models/bogus/
    rules:
      # Preserve stylecheck exemptions for deliberately named model fixtures.
      - path: internal/test/models/good\.go
        linters: [staticcheck]
        text: "^ST[0-9]+:"
      # SQL construction is the purpose of this library.
      - linters: [gosec]
        text: "G20[12]: SQL string (formatting|concatenation)"
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gopkg.in/reform.v1
  exclusions:
    paths:
      - internal/test/models/bogus/
output:
  formats:
    text:
      path: stdout
      colors: false
      print-issued-lines: false
