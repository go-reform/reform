---
version: "2"
# Almost all linters; findings from this configuration are advisory.
linters:
  default: all
  disable:
    - exhaustruct # Replaced by exhaustruct_v5.
    - gomodguard # Replaced by gomodguard_v2.
    - lll
    - nlreturn
    - wrapcheck # Preserve reform v1's error compatibility.
    - wsl
    - wsl_v5
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
            - gopkg.in/reform.v1
            - github.com/
    govet:
      enable:
        - shadow
  exclusions:
    presets: []
    paths:
      - internal/test/models/bogus/
    rules:
      # Preserve stylecheck exemptions for deliberately named model fixtures.
      - path: internal/test/models/good\.go
        linters: [staticcheck]
        text: "^ST[0-9]+:"
      - linters: [gosec]
        text: "G20[12]: SQL string (formatting|concatenation)"
      - path: _test\.go
        linters:
          - funlen
          - testpackage
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gopkg.in/reform.v1
  exclusions:
    paths:
      - internal/test/models/bogus/
output:
  formats:
    text:
      path: stdout
      colors: false
      print-issued-lines: false
